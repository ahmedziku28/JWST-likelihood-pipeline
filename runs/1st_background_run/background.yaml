    use_abs_mag: True
  bao.desi_dr2: null
#   path: "home/lustre_p/ahmed.omar/workspace/exo_de_project/likelihood/"



params:
 
  # --- Baryon density ---
  # BBN prior
  # Omega_b h^2 = 0.02235 +/- 0.00037
  omega_b:
    prior:
      dist: norm
      loc: 0.02235
      scale: 0.00037
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.00010
    proposal: 0.00008
    latex: \Omega_{\rm b} h^2
 
  # --- Cold dark matter density ---
  omega_cdm:
    prior:
      min: 0.08
      max: 0.16
    ref:
      dist: norm
      loc: 0.1200
      scale: 0.002
    proposal: 0.001
    latex: \Omega_{\rm c} h^2
 
  # --- Hubble constant ---
  # Wide uniform prior — let BAO + Pantheon + SH0ES likelihood pull it
  H0:
    prior:
      min: 55.0
      max: 90.0
    ref:
      dist: norm
      loc: 67.4
      scale: 2.0
    proposal: 0.5
    latex: H_0
 


  # ── Sampled parameters ─────────────────────────────────────────────────
  a_samp:
    prior:
      min: -1838.5
      max: -1.0e-6
    ref:
      dist: norm
      loc:   -903.588
      scale:  300.0
    proposal: 250.0
    drop: True                   
    latex: a_{samp}

  s:
    prior:
      min: -1382
      max: -1.0e-6
    ref:
      dist: norm
      loc:   -658.290
      scale:  300.0
    proposal: 250.0
    drop: True                   
    latex: \mathcal{S}
    
# --- Absolute Mag ----
    
  Mb:
    prior:
      min: -22.0
      max: -18.0
    ref:
      dist: norm
      loc: -19.25
      scale: 0.05
    proposal: 0.04
    latex: M
 
  # --- Fixed parameters (Planck 2018 best-fit, Table 2 of 1807.06209) ---
  tau_reio:
    value: 0.0544
    latex: \tau_{\rm reio}
  
  logA:
    value: 3.044
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
 
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
 
  n_s:
    value: 0.9649
    latex: n_s
 
  Omega_Lambda:
    derived: true
    latex: \Omega_\Lambda
 
  Omega_m:
    derived: true
    latex: \Omega_m
 
  age:
    derived: true
    latex: t_0 \,[\rm Gyr]
 
  rs_drag:
    derived: true
    latex: r_{\rm s,drag} \,[\rm Mpc]

  # --- 2. DERIVED PARAMETERS ---

  a_exo:
    value: 'lambda a_samp: a_samp'
    latex: a_\mathrm{exo}

  b_exo:
    value: 'lambda a_samp, s: s - a_samp'
    latex: b_\mathrm{exo}

  Omega_b:
    derived: 'lambda omega_b, H0: omega_b * (100/H0)**2'
    latex: \Omega_\mathrm{b}

  Omega_cdm:
    derived: 'lambda omega_cdm, H0: omega_cdm * (100/H0)**2'
    latex: \Omega_\mathrm{c}

  Omega_x0:
    derived: 'lambda a_exo: a_exo * 5.45846e-6'
    latex: \Omega_\mathrm{x}
    

  # Sigma8 and S8
  sigma8:
    latex: \sigma_8
  
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8

  # Reionization & Drag Scale
  z_reio:
    latex: z_\mathrm{re}

  m_ncdm:
    value: 0.06
    renames: mnu
    

# prior:
#   h2_positivity: |
#     import numpy as np
#     slope = -0.07202
#     intercept = -1381.59690
#     def _logp(a_samp, s):
#         if s >= slope * a_samp + intercept:
#             return 0.0
#         else:
#             return -np.inf
#     return _logp  # will be added to likelihood function later, cleaner
prior:
  h2_positivity: "lambda a_samp, s: 0.0 if s >= (-0.07202 * a_samp - 1381.5969) else -1e500"

    
    
sampler:
  mcmc:
    burn_in: 0
    drag: True
    measure_speeds: True
    oversample_power: 0.3
    covmat: auto
    learn_every: 40d
    proposal_scale: 2.5
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2

# # to find good loc, scale, etc. for new params, redundant in background likelihood because will be flat anyway 
