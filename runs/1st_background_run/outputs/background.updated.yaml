    max_samples: .inf
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.3
    oversample_thin: true
    drag: true
    blocking:
    - - 1
      - - H0
    - - 1
      - - omega_b
        - omega_cdm
        - a_samp
        - s
    - - 3
      - - Mb
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.5.7
output: background
