prior:
  h2_positivity: 'lambda a_samp, s: 0.0 if s >= (-0.07202 * a_samp - 1381.5969) else
    -1e500'
params:
  omega_b:
    prior:
      dist: norm
      loc: 0.02235
      scale: 0.00037
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.0001
    proposal: 8.0e-05
    latex: \Omega_{\rm b} h^2
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.08
      max: 0.16
    ref:
      dist: norm
      loc: 0.12
      scale: 0.002
    proposal: 0.001
    latex: \Omega_{\rm c} h^2
    renames:
    - omegach2
  H0:
    prior:
      min: 55.0
      max: 90.0
    ref:
      dist: norm
      loc: 67.4
      scale: 2.0
    proposal: 0.5
    latex: H_0
  a_samp:
    prior:
      min: -1838.5
      max: -1.0e-06
    ref:
      dist: norm
      loc: -903.588
      scale: 300.0
    proposal: 250.0
    drop: true
    latex: a_{samp}
  s:
    prior:
      min: -1382
      max: -1.0e-06
    ref:
      dist: norm
      loc: -658.29
      scale: 300.0
    proposal: 250.0
    drop: true
    latex: \mathcal{S}
  Mb:
    prior:
      min: -22.0
      max: -18.0
    ref:
      dist: norm
      loc: -19.25
      scale: 0.05
    proposal: 0.04
    latex: M
  tau_reio:
    value: 0.0544
    latex: \tau_{\rm reio}
    renames:
    - tau
  logA:
    value: 3.044
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
    renames:
    - As
  n_s:
    value: 0.9649
    latex: n_s
    renames:
    - ns
  Omega_Lambda:
    derived: true
    latex: \Omega_\Lambda
    renames:
    - omegal
  Omega_m:
    derived: true
    latex: \Omega_m
    renames:
    - omegam
  age:
    derived: true
    latex: t_0 \,[\rm Gyr]
  rs_drag:
    derived: true
    latex: r_{\rm s,drag} \,[\rm Mpc]
    renames:
    - rdrag
  a_exo:
    value: 'lambda a_samp: a_samp'
    latex: a_\mathrm{exo}
    derived: true
  b_exo:
    value: 'lambda a_samp, s: s - a_samp'
    latex: b_\mathrm{exo}
    derived: true
  Omega_b:
    derived: 'lambda omega_b, H0: omega_b * (100/H0)**2'
    latex: \Omega_\mathrm{b}
    renames:
    - omegab
  Omega_cdm:
    derived: 'lambda omega_cdm, H0: omega_cdm * (100/H0)**2'
    latex: \Omega_\mathrm{c}
    renames:
    - omegac
  Omega_x0:
    derived: 'lambda a_exo: a_exo * 5.45846e-6'
    latex: \Omega_\mathrm{x}
  sigma8:
    latex: \sigma_8
    derived: true
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  z_reio:
    latex: z_\mathrm{re}
    derived: true
    renames:
    - zrei
  m_ncdm:
    value: 0.06
    renames: mnu
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__H0:
    latex: \chi^2_\mathrm{H0}
    derived: true
  chi2__SN:
    latex: \chi^2_\mathrm{SN}
    derived: true
sampler:
  mcmc:
    burn_in: 0
    max_tries: 40d
    covmat: auto
    covmat_params: null
    proposal_scale: 2.5
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
