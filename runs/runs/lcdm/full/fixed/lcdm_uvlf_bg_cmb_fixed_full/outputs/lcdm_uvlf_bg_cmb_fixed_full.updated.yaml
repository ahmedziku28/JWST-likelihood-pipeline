params:
  theta_s_100:
    prior:
      min: 0.9
      max: 1.2
    ref:
      dist: norm
      loc: 1.0416
      scale: 0.0004
    proposal: 0.0002
    latex: 100\theta_{\rm s}
  omega_b:
    prior:
      dist: norm
      loc: 0.02235
      scale: 0.00037
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.0001
    proposal: 8.0e-05
    latex: \Omega_{\rm b} h^2
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.05
      max: 0.18
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_{\rm c} h^2
    renames:
    - omegach2
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_{\rm reio}
    renames:
    - tau
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    drop: true
    latex: \log(10^{10} A_{\rm s})
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_{\rm s}
    renames:
    - ns
  m_ncdm:
    value: 0.06
    renames: mnu
  Omega_m:
    derived: true
    latex: \Omega_m
    renames:
    - omegam
  Omega_Lambda:
    derived: true
    latex: \Omega_\Lambda
    renames:
    - omegal
  sigma8:
    latex: \sigma_8
    derived: true
  Omega_b:
    derived: 'lambda omega_b, H0: omega_b * (100/H0)**2'
    latex: \Omega_{\rm b}
    renames:
    - omegab
  Omega_cdm:
    derived: 'lambda omega_cdm, H0: omega_cdm * (100/H0)**2'
    latex: \Omega_{\rm c}
    renames:
    - omegac
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  age:
    derived: true
    latex: t_0 \,[\rm Gyr]
  rs_drag:
    derived: true
    latex: r_{\rm s,drag} \,[\rm Mpc]
    renames:
    - rdrag
  H0:
    latex: H_0
    derived: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_{\rm s}
    derived: true
    renames:
    - As
  z_reio:
    latex: z_{\rm re}
    derived: true
    renames:
    - zrei
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_\mathrm{cal}
    renames: calPlanck
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
  chi2__H0:
    latex: \chi^2_\mathrm{H0}
    derived: true
  chi2__SN:
    latex: \chi^2_\mathrm{SN}
    derived: true
sampler:
  mcmc:
    burn_in: 0
    max_tries: 2000
    covmat: lcdm_uvlf_bg_cmb_fixed_full.covmat
    covmat_params: null
    proposal_scale: 1.9
    output_every: 60s
    learn_every: 11d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - theta_s_100
        - omega_b
        - omega_cdm
        - tau_reio
        - logA
        - n_s
    - - 1
      - - A_planck
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.5.7
output: lcdm_uvlf_bg_cmb_fixed_full
version: 3.5.7
