theory:
  classy:
    path: global
    stop_at_error: false
    extra_args:
      z_c_exo: 16.0
      sigma_z_exo: 3.25
      N_ncdm: 1
      N_ur: 2.0328
      P_k_max_1/Mpc: 150.0
      z_max_pk: 16.0
likelihood:
  jwst_likelihood_uvlf.UVLFLikelihood:
    python_path: /home/lustre_p/ahmed.omar/workspace/exo_de_project/likelihood/
    integrate_bin: true
    use_volume_correction: false
    n_gl: 2
    z_min_donnan: 9.0
    z_min_finkelstein: 8.9
    use_donnan_bins: true
    use_finkelstein_bins: true
    vary_SHMR: false
    vary_beta: false
prior:
  h2_positivity: 'lambda a_samp, s: 0.0 if s >= (-0.07202 * a_samp - 1381.5969) else
    -1e500'
params:
  a_samp:
    prior:
      min: -350.0
      max: -1.0e-10
    ref:
      min: -75.0
      max: -5.0
    proposal: 5.0
    drop: true
    latex: a_{\rm samp}
  s:
    prior:
      min: -1000.0
      max: -1.0e-10
    ref:
      min: -250.0
      max: -50.0
    proposal: 20.0
    drop: true
    latex: \mathcal{S}
  a_exo:
    value: 'lambda a_samp: a_samp'
    latex: a_{\rm exo}
  b_exo:
    value: 'lambda a_samp, s: s - a_samp'
    latex: b_{\rm exo}
  H0:
    value: 67.36
    latex: H_0
  omega_b:
    value: 0.02237
    latex: \Omega_{\rm b} h^2
  omega_cdm:
    value: 0.12
    latex: \Omega_{\rm c} h^2
  tau_reio:
    value: 0.0544
    latex: \tau_{\rm reio}
  logA:
    value: 3.044
    drop: true
    latex: \log(10^{10} A_{\rm s})
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_{\rm s}
  n_s:
    value: 0.9649
    latex: n_{\rm s}
  m_ncdm:
    value: 0.06
    renames: mnu
sampler:
  mcmc:
    covmat: auto
    drag: false
    oversample_power: 0
    proposal_scale: 2.8
    Rminus1_stop: 0.05
    Rminus1_cl_stop: 0.2
    learn_every: 5d
    max_samples: 500
output: builder_exo_fixed
