likelihood:
  jwst_likelihood_uvlf.UVLFLikelihood:
    use_volume_correction: false
    integrate_bin: true
    n_gl: 2
    z_min_donnan: 9.0
    z_min_finkelstein: 8.9
    vary_SHMR: false
    vary_beta: true
    use_donnan_bins: true
    use_finkelstein_bins: true
    type: []
    speed: -1
    stop_at_error: false
    version: null
    python_path: /home/lustre_p/ahmed.omar/workspace/exo_de_project/likelihood/
    input_params:
    - shmr_beta
    output_params: []
params:
  H0:
    value: 67.36
    latex: H_0
  omega_b:
    value: 0.02237
    latex: \Omega_{\rm b} h^2
    renames:
    - omegabh2
  omega_cdm:
    value: 0.12
    latex: \Omega_{\rm c} h^2
    renames:
    - omegach2
  tau_reio:
    value: 0.0544
    latex: \tau_{\rm reio}
    renames:
    - tau
  logA:
    value: 3.044
    drop: true
    latex: \log(10^{10} A_{\rm s})
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_{\rm s}
    derived: true
    renames:
    - As
  n_s:
    value: 0.9649
    latex: n_{\rm s}
    renames:
    - ns
  shmr_beta:
    prior:
      dist: norm
      loc: 1.35
      scale: 0.26
    ref: 1.35
    proposal: 0.05
    latex: \beta_{\rm SHMR}
  m_ncdm:
    value: 0.06
    renames: mnu
sampler:
  mcmc:
    burn_in: 0
    max_tries: 40d
    covmat: auto
    covmat_params: null
    proposal_scale: 2.8
    output_every: 60s
    learn_every: 5d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: 800
