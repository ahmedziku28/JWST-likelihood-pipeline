theory:
  classy:
    path: global
    speed: 0.2
    stop_at_error: false
    extra_args:
      z_c_exo: 16.0
      sigma_z_exo: 3.25
      N_ncdm: 1
      N_ur: 2.0328
      P_k_max_1/Mpc: 150.0
      z_max_pk: 16.0
    ignore_obsolete: false
    use_renames: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
    version: v3.3.4
    input_params:
    - a_exo
    - b_exo
    - H0
    - omega_b
    - omega_cdm
    - tau_reio
    - A_s
    - n_s
    - m_ncdm
    output_params: []
likelihood:
  jwst_likelihood_uvlf.UVLFLikelihood:
    use_volume_correction: false
    integrate_bin: true
    n_gl: 2
    z_min_donnan: 9.0
    z_min_finkelstein: 8.9
    vary_SHMR: true
    vary_beta: false
    use_donnan_bins: true
    use_finkelstein_bins: true
    type: []
    speed: -1
    stop_at_error: false
    version: null
    python_path: /home/lustre_p/ahmed.omar/workspace/exo_de_project/likelihood/
    input_params:
    - shmr_N
    - shmr_log_Mc
    - shmr_beta
    output_params: []
prior:
  h2_positivity: 'lambda a_samp, s: 0.0 if s >= (-0.07202 * a_samp - 1381.5969) else
    -1e500'
params:
  a_samp:
    prior:
      min: -350.0
      max: -1.0e-10
    ref:
      min: -75.0
      max: -3.0
    proposal: 3.0
    drop: true
    latex: a_{\rm samp}
  s:
    prior:
      min: -1000.0
      max: -1.0e-10
    ref:
      min: -250.0
      max: -50.0
    proposal: 20.0
    drop: true
    latex: \mathcal{S}
  a_exo:
    value: 'lambda a_samp: a_samp'
    latex: a_{\rm exo}
    derived: true
  b_exo:
    value: 'lambda a_samp, s: s - a_samp'
    latex: b_{\rm exo}
    derived: true
  H0:
    value: 67.36
    latex: H_0
  omega_b:
    value: 0.02237
    latex: \Omega_{\rm b} h^2
    renames:
    - omegabh2
  omega_cdm:
    value: 0.12
    latex: \Omega_{\rm c} h^2
    renames:
    - omegach2
  tau_reio:
    value: 0.0544
    latex: \tau_{\rm reio}
    renames:
    - tau
  logA:
    value: 3.044
    drop: true
    latex: \log(10^{10} A_{\rm s})
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_{\rm s}
    derived: true
    renames:
    - As
  n_s:
    value: 0.9649
    latex: n_{\rm s}
    renames:
    - ns
  shmr_log_Mc:
    prior:
      dist: norm
      loc: 11.5
      scale: 0.2
    ref: 11.5
    proposal: 0.04
    latex: \log_{10}(M_c)
  shmr_N:
    prior:
      dist: norm
      loc: 0.0297
      scale: 0.0065
    ref: 0.0297
    proposal: 0.0013
    latex: N_{\rm SHMR}
  shmr_beta:
    prior:
      dist: norm
      loc: 1.35
      scale: 0.26
    ref: 1.35
    proposal: 0.05
    latex: \beta_{\rm SHMR}
  m_ncdm:
    value: 0.06
    renames: mnu
sampler:
  mcmc:
    burn_in: 0
    max_tries: 500
    covmat: outputs/builder.covmat
    covmat_params: null
    proposal_scale: 1.3
    output_every: 60s
    learn_every: 2d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: 1000
    Rminus1_stop: 0.05
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - a_samp
        - s
    - - 1
      - - shmr_log_Mc
        - shmr_N
        - shmr_beta
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.5.7
output: builder_exo_vshmr
version: 3.5.7
